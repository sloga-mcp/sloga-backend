name: Backend CI

on:
  push:
    branches:
      - acutest
      # Lets a CI change be proven on its own branch before it lands.
      - "ci/**"
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-ci-${{ github.head_ref || github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: 0
  # No debug info: the test build is several GB smaller and links faster, and
  # a failing test still reports its panic message and location.
  CARGO_PROFILE_DEV_DEBUG: 0
  CARGO_PROFILE_TEST_DEBUG: 0

jobs:
  test:
    name: Build and test (reference database)
    runs-on: ubuntu-24.04
    timeout-minutes: 150

    steps:
      - name: Free disk space
        run: |
          sudo rm -rf /usr/local/lib/android /usr/share/dotnet /opt/ghc /usr/local/.ghcup
          df -h /

      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      # The same build libraries as the Dockerfile, plus ffmpeg, which the
      # autumn video tests run.
      - name: Install system packages
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            pkg-config libssl-dev libdav1d-dev ffmpeg

      - name: Install the pinned Rust toolchain
        # With no argument, rustup installs the toolchain rust-toolchain.toml names.
        run: rustup toolchain install --profile minimal

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2

      - uses: taiki-e/install-action@183e4297cca2404691e9380e1307288dced5c82a # v2.87.25
        with:
          tool: cargo-nextest

      # Everything the reference-database tests talk to (Revolt.test.toml),
      # minus MongoDB: Redis, RabbitMQ, MinIO with its bucket, and the SMTP
      # mock. They run on this throwaway runner only.
      - name: Start test services
        run: |
          docker compose up -d redis rabbit minio createbuckets maildev
          for port in 6379 5672 14009 14025; do
            timeout 120 bash -c "until (echo > /dev/tcp/127.0.0.1/$port) 2> /dev/null; do sleep 1; done" \
              || { echo "::error::port $port never opened"; docker compose logs; exit 1; }
          done
          # RabbitMQ opens its port before it accepts logins.
          timeout 120 bash -c "until docker compose exec -T rabbit rabbitmq-diagnostics -q check_running; do sleep 2; done"

      - name: Test
        env:
          # REFERENCE is the in-memory database driver. Always set it: with no
          # TEST_DB the tests read the normal config instead of Revolt.test.toml.
          TEST_DB: REFERENCE
        run: |
          set -o pipefail
          cargo nextest run --locked --no-fail-fast 2>&1 | tee nextest.log

      # Annotations can be read without signing in to GitHub, unlike the
      # raw log, so the failing tests and compile errors are listed there too.
      - name: List failures
        if: failure()
        run: |
          [ -f nextest.log ] || exit 0
          list=$(grep -E '^\s*(FAIL|TIMEOUT|SIGSEGV|SIGABRT|SIGKILL)\b|^error(\[E[0-9]+\])?:' nextest.log \
            | sed -E 's/^\s+//; s/\x1b\[[0-9;]*m//g' | sort -u | head -80 | awk '{printf "%s%%0A", $0}')
          echo "::error title=Backend tests failed::${list:-no FAIL or error lines found; see the log}"
