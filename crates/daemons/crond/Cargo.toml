[package]
name = "revolt-crond"
version = "0.13.7"
license = "AGPL-3.0-or-later"
authors = ["Paul Makles <me@insrt.uk>"]
edition = "2021"
description = "Revolt Daemon Service: Timed data clean up tasks"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Utility
log = { workspace = true }
ulid = { workspace = true }

# Async
tokio = { workspace = true }
futures = { workspace = true }

# Redis
redis-kiss = { workspace = true, default-features = false, features = ["tokio-runtime"] }

# RabbitMQ
lapin = { workspace = true }
futures-lite = { workspace = true }

# HTTP (Twitch Helix / YouTube Data API live checks). "query" is NOT
# default in reqwest 0.13 — required for .query(), don't rely on
# workspace feature unification
reqwest = { workspace = true, features = ["json", "query"] }

# Processing
serde_json = { workspace = true }
revolt_optional_struct = { workspace = true }
serde = { workspace = true }
iso8601-timestamp = { workspace = true, features = ["serde", "bson"] }

# Core
# Scheduled-message delivery runs Message::create_from_api with FULL live
# side-effects — the "tasks" feature (push/ack/embed queues) and "mongodb"
# are default features today, but are spelled out so a future
# default-features change cannot silently degrade scheduled sends.
revolt-database = { workspace = true, features = ["tasks", "mongodb"] }
revolt-result = { workspace = true }
revolt-config = { workspace = true }
revolt-files = { workspace = true }
revolt-permissions = { workspace = true }
revolt-presence = { workspace = true }
revolt-models = { workspace = true }
