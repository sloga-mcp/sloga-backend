[package]
name = "revolt-crond"
version = "0.13.7"
license = "AGPL-3.0-or-later"
authors = ["Paul Makles <me@insrt.uk>"]
edition = "2021"
description = "Revolt Daemon Service: Timed data clean up tasks"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[dependencies]
# Utility
log = { workspace = true }
ulid = { workspace = true }

# Async
tokio = { workspace = true }
futures = { workspace = true }

# Redis
redis-kiss = { workspace = true, default-features = false, features = ["tokio-runtime"] }

# RabbitMQ
lapin = { workspace = true }
futures-lite = { workspace = true }

# HTTP (Twitch Helix / YouTube Data API live checks). "query" is NOT
# default in reqwest 0.13 — required for .query(), don't rely on
# workspace feature unification
reqwest = { workspace = true, features = ["json", "query"] }

# Processing
serde_json = { workspace = true }
revolt_optional_struct = { workspace = true }
serde = { workspace = true }
iso8601-timestamp = { workspace = true, features = ["serde", "bson"] }

# Core
# `tasks` compiles the enqueue calls in `Message::send` (last_message_id /
# mention+push / embed queues). The queues are process-local statics; the side
# effects happen only because `main.rs` starts
# `revolt_database::tasks::start_workers` in this same process. Removing either
# the feature or that call silently drops them. "tasks" and "mongodb" are
# default features today but are spelled out so a future default-features
# change cannot silently degrade crond.
#
# "voice" is required by `stream_live` and `prune_remote_control_grants`, both
# of which import `revolt_database::voice`. It used to be absent and the crate
# still built, because `cargo build --bin revolt-crond` from the workspace root
# unifies features across the default members and delta turns "voice" on. That
# made `cargo build -p revolt-crond` fail on its own with an unresolved import —
# which is the form the house rule uses for service pre-builds.
revolt-database = { workspace = true, features = ["tasks", "mongodb", "voice"] }
revolt-result = { workspace = true }
revolt-config = { workspace = true }
revolt-files = { workspace = true }
nanoid = { workspace = true }
sha2 = { workspace = true }
revolt-permissions = { workspace = true }
revolt-presence = { workspace = true }
revolt-models = { workspace = true }
