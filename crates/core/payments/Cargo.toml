[package]
name = "revolt-payments"
version = "0.13.7"
edition = "2021"
license = "AGPL-3.0-or-later"
authors = ["Sloga Technologies LLC <sloga@sloga.gg>"]
description = "Revolt Backend: Payments (Stripe) and the Cipher sale"
publish = false

# See more keys and their definitions at https://doc.rust-lang.org/cargo/reference/manifest.html

[features]
# Exposes `stripe::MockStripe` to other crates' tests (delta routes, crond)
test-mock = []

[dependencies]
# Core
revolt-database = { workspace = true }
revolt-models = { workspace = true }
revolt-config = { workspace = true }
revolt-result = { workspace = true }
revolt-permissions = { workspace = true }

# Async Language Features
async-trait = { workspace = true }

# Async runtime (the tank-update coalescer's trailing publish)
tokio = { workspace = true, features = ["rt", "time"] }

# Web Requests
reqwest = { workspace = true, features = ["json", "form"] }

# Serialisation
serde = { workspace = true }
serde_json = { workspace = true }

# Time (RFC 3339 parsing of `cipher_sales_close_at`)
chrono = { workspace = true }

# Security (webhook signatures)
hmac = { workspace = true }
sha2 = { workspace = true }
subtle = { workspace = true }

# Logging
log = { workspace = true }

# Order ids
ulid = { workspace = true }

# In-app purchases (S6): the Apple JWS verifier (store/apple_jws.rs) and the App Store / Google
# Play clients (store/). Pinned to the versions already in Cargo.lock; x509-cert without its
# default features (they pull tls_codec into the lock)
base64 = { workspace = true }
const-oid = "=0.9.6"
der = { version = "=0.7.10", features = ["alloc", "oid"] }
ecdsa = { version = "=0.16.9", features = ["der", "verifying"] }
jsonwebtoken = { workspace = true }
p256 = { version = "=0.13.2", features = ["ecdsa"] }
p384 = { version = "=0.13.1", features = ["ecdsa"] }
x509-cert = { version = "=0.2.5", default-features = false }
# Store intent tokens (Apple appAccountToken UUID v4, Play random account id)
uuid = { workspace = true, features = ["v4"] }
rand = { workspace = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt", "macros", "time"] }
# Drops the throwaway Mongo test databases even when a test panics
revolt-database = { workspace = true, features = ["test-teardown"] }
