environment = "test"

[database]
mongodb = "mongodb://localhost"
redis = "redis://localhost/"

[rabbit]
host = "127.0.0.1"
port = 5672
username = "rabbituser"
password = "rabbitpass"

[features]
webhooks_enabled = true
e2ee_enabled = true
media_e2ee_enabled = true
events_enabled = true
remote_control = true
screen_leg = true

[api.smtp]
host = "localhost"
username = "smtp"
password = "smtp"
from_address = "development@stoat.chat"
reply_to = "support@stoat.chat"
port = 14025
use_tls = false


# Chunked uploads only engage ABOVE one 32 MiB chunk (create_upload rejects
# anything at or below a chunk with FileTooSmall), so the base config 20 MB
# attachment limit leaves an empty window: every chunked upload is rejected,
# FileTooSmall below a chunk and FileTooLarge above it. Production and
# docs/chunked-resumable-uploads-design.md both run the 5 GB ceiling, but it
# lives in the gitignored Revolt.overrides.toml, so without it here the
# chunked-upload tests only pass on a box that happens to have that file.
[features.limits.global]
body_limit_size = 5_000_000_000

[features.limits.default.file_upload_size_limit]
attachments = 5_000_000_000

[features.limits.new_user.file_upload_size_limit]
attachments = 5_000_000_000
