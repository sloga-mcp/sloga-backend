environment = "test"

[database]
mongodb = "mongodb://localhost"
redis = "redis://localhost/"

[rabbit]
host = "127.0.0.1"
port = 5672
username = "rabbituser"
password = "rabbitpass"

[features]
webhooks_enabled = true
e2ee_enabled = true
media_e2ee_enabled = true
events_enabled = true
remote_control = true
screen_leg = true

[api.smtp]
host = "localhost"
username = "smtp"
password = "smtp"
from_address = "development@stoat.chat"
reply_to = "support@stoat.chat"
port = 14025
use_tls = false


# Pin the upload ceiling for tests. These now match the committed
# Revolt.toml, so this block raises nothing - it exists to stop a developer
# machine local Revolt.overrides.toml from lowering the limit out from under
# the chunked-upload tests, the same way the [api.smtp] block above keeps
# deploy mail config out of the email tests. Overrides load BEFORE this file,
# so pinning here wins.
#
# The tests need headroom above CHUNK_SIZE (32 MiB): create_upload rejects
# anything at or below one chunk as FileTooSmall and anything above the limit
# as FileTooLarge, so a limit under 32 MiB leaves an empty window and every
# chunked upload fails.
[features.limits.global]
body_limit_size = 5_000_000_000

[features.limits.default.file_upload_size_limit]
attachments = 5_000_000_000

[features.limits.new_user.file_upload_size_limit]
attachments = 5_000_000_000
