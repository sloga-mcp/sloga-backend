[files]
# Encryption key for stored files
# Generate your own key using `openssl rand -base64 32`
encryption_key = "qcuMA+ssxhMyKaNAKBGFfryfFtUH8NDlamQyDwGW6fU="
# Id of the key above. The primary key is encryption_key together with this
# id: it encrypts every new upload, and new rows record the id (no id at
# all when it is "legacy").
#
# Older keys stay readable through [files.decrypt_keys], which maps a key id
# to its base64 32-byte key, for example:
#
# [files.decrypt_keys]
# k2024 = "<base64 32-byte key>"
#
# "legacy" is the id for rows with no key id (everything written before key
# ids existed). Every other id is 1 to 16 lowercase letters or digits
# ([a-z0-9]{1,16}); ids must be lowercase.
#
# To rotate, move the current key into [files.decrypt_keys] under its current
# id, then set a new encryption_key and a new encryption_key_id.
encryption_key_id = "legacy"
# Refuse to start while the primary key is the committed default above or its
# id is "legacy". Enable in production once the key has been rotated.
require_rotated_key = false
# Quality used for lossy WebP previews (set to 100 for lossless)
webp_quality = 80.0
# Mime types that cannot be uploaded or served
#
# Example for Windows executables and Android installation files:
# ["application/vnd.microsoft.portable-executable", "application/vnd.android.package-archive"]
blocked_mime_types = []
# ClamAV service
# hostname:port
clamd_host = ""
# Mime types that should be virus scanned
#
# Leave empty to scan all file types
scan_mime_types = [
    "application/vnd.microsoft.portable-executable",
    "application/vnd.android.package-archive",
    "application/zip",
]

[files.limit]
# Minimum file size (in bytes)
min_file_size = 1
# Minimum image resolution
min_resolution = [1, 1]
# Maximum MP of images
max_mega_pixels = 40
# Maximum pixel side of an image
max_pixel_side = 10_000

[files.preview]
# Maximum image resolution
attachments = [1280, 1280]
avatars = [128, 128]
backgrounds = [1280, 720]
icons = [128, 128]
banners = [480, 480]
