[test-groups]
# The account-credential tests (change_email, change_password) argon2-hash
# passwords in the route under test on top of the usual harness cost, and
# adjacent scheduling starts all 8 at once. They were the suite's reliable
# first casualties: every one passes in isolation (~9s) but together they
# contended straight through the old 50s kill cap. Cap how many run
# concurrently instead of letting them stampede.
account-credential-heavy = { max-threads = 2 }
# Same stampede shape, next generation: every remote-control route test
# boots a full rocket + a server + a voice channel + THREE users via
# server_call(), and adjacent scheduling starts all 8 at once. Measured
# 2026-07-28: ~9s in isolation, 43s as a group of 8, 110-120s inside the
# full suite — where accept_fails_closed_when_sfu_refuses crossed the
# 120s kill cap. Cap the stampede instead of raising the global cap.
remote-control-heavy = { max-threads = 2 }

[profile.default]
# 120s kill cap (was 5s/10 = 50s). Under default parallelism this 8-core box
# (which also runs the prod services) boots 8 rocket instances + 8 throwaway
# Mongo databases at once, and a typical test then takes 40-50s wall — a
# 2026-07-27 full run had 51/51 passes flagged slow with peaks at 49s, and
# whichever tests landed worst in the scheduling crossed 50s and were killed
# (load-dependent, so the victim set changed run to run). 120s keeps a genuine
# hang detectable without killing load-dependent stragglers.
slow-timeout = { period = "10s", terminate-after = 12 }

[[profile.default.overrides]]
filter = 'package(revolt-delta) & (test(routes::account::change_email) | test(routes::account::change_password))'
test-group = 'account-credential-heavy'

[[profile.default.overrides]]
filter = 'package(revolt-delta) & test(routes::channels::remote_control::)'
test-group = 'remote-control-heavy'

[[profile.default.overrides]]
# Bulk "cap" tests: each mass-inserts rows to prove a numeric limit (import
# scan cap, one-time-key cap, member cap, MLS caps), so their duration scales
# with mongod latency and suite load. Observed 72-99s in the 2026-07-27 full
# run with the import test crossing 120s. 300s keeps hangs detectable;
# anything new that mass-inserts to a cap belongs in this list.
# create_post_is_exempt_from_thread_cap inserts threads_per_channel (100)
# forum posts to prove posts skip the thread cap: ~73s alone on MONGODB, so
# the 120s default has no headroom under full-suite load.
filter = '''
package(revolt-delta) & (
    test(=routes::events::tests::import_paginates_and_truncates)
  | test(=routes::e2ee::tests::one_time_key_cap_counts_upserts_correctly)
  | test(=routes::servers::server_join::test::join_rejected_at_server_cap)
  | test(=routes::mls::tests::publish_validates_binding_caps_and_immutability)
  | test(=routes::channels::forum_post_create::test::create_post_is_exempt_from_thread_cap)
)
'''
slow-timeout = { period = "15s", terminate-after = 20 }

[[profile.default.overrides]]
# The chunked-upload end-to-end test moves a full 32 MiB chunk through the
# stream cipher repeatedly - out-of-order parts, an idempotent re-PUT, a
# divergent re-PUT, complete, a complete-retry, then a second identical
# upload to exercise dedupe - against live MinIO. That is unavoidably slow
# in an unoptimized debug build: measured 128s on the WSL rig 2026-09-13,
# i.e. just past the 120s default cap, so it was being killed rather than
# failing. 300s keeps a genuine hang detectable.
# rotated_primary_is_frozen_into_the_session has the same shape on a smaller
# scale: it builds a full 32 MiB part, sha256-hashes it and seals it through
# the stream cipher, again in a debug build against live MinIO. Measured 105s
# in a 2026-10-05 full-suite run, too close to the 120s default cap.
filter = '''
package(revolt-autumn) & (
    test(=upload::tests::chunked_upload_end_to_end)
  | test(=upload::tests::rotated_primary_is_frozen_into_the_session)
)
'''
slow-timeout = { period = "15s", terminate-after = 20 }
